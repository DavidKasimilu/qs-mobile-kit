name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Prepare web assets (copy app files + Lucide icons with SRI)
        run: node scripts/prepare-www.js

      - name: Add Android platform
        run: npx cap add android

      - name: Generate launcher icons from assets/icon-512.png
        continue-on-error: true
        run: |
          mkdir -p resources-tmp
          convert assets/icon-512.png -resize 1024x1024 resources-tmp/icon-only.png
          npx capacitor-assets generate --android --assetPath resources-tmp --iconBackgroundColor '#ffffff'

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: quicksell-pos-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
